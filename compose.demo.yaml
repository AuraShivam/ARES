name: ares-demo

x-backend-image: &backend-image
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: ares-backend:demo
  env_file:
    - .env.demo
  environment:
    DJANGO_DEBUG: "true"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
    CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    DJANGO_TRUST_PROXY_SSL: "false"
    DJANGO_SECURE_SSL_REDIRECT: "false"
    DJANGO_SECURE_HSTS_SECONDS: "0"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_SSLMODE: disable
    ARES_REDIS_URL: redis://redis:6379/0
  init: true
  networks: [app]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ares_demo}
      POSTGRES_USER: ${POSTGRES_USER:-ares_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ares-demo-only-local-db-password}
    volumes:
      - ares_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app]

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [app]

  migrate:
    <<: *backend-image
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-image
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  gdacs-worker:
    <<: *backend-image
    command: ["python", "manage.py", "sync_gdacs_alerts", "--watch"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    <<: *backend-image
    profiles: [notifications]
    command: ["python", "manage.py", "run_notification_worker", "--interval-seconds", "15", "--limit", "100"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  backup-worker:
    image: postgres:17-alpine
    environment:
      PGDATABASE: ${POSTGRES_DB:-ares_demo}
      PGUSER: ${POSTGRES_USER:-ares_demo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ares-demo-only-local-db-password}
      PGHOST: postgres
      PGPORT: "5432"
      PGSSLMODE: disable
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETENTION_DAYS: "7"
    command: ["/bin/sh", "-c", "while :; do /usr/local/bin/backup_postgres.sh || true; sleep \"$$BACKUP_INTERVAL_SECONDS\"; done"]
    volumes:
      - ./ops/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
      - ares_demo_backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups -maxdepth 1 -type f -name 'ares-*.dump' -mmin -1500 -print -quit)\""]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 10m
    restart: unless-stopped
    networks: [app]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        CADDY_IMAGE: caddy:2.11.7-alpine
        VITE_API_BASE_URL: /api
    image: ares-web:demo
    entrypoint: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.demo", "--adapter", "caddyfile"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./frontend/Caddyfile.demo:/etc/caddy/Caddyfile.demo:ro
    restart: unless-stopped
    networks: [app]
    stop_grace_period: 30s

volumes:
  ares_demo_postgres:
  ares_demo_backups:

networks:
  app:
